_format_version: "3.0"
_konnect:
  control_plane_name: kong-local-dev

services:
- name: mock-service
  host: example.com
  protocol: https
  port: 443
  enabled: true
  connect_timeout: 60000
  read_timeout: 60000
  write_timeout: 60000
  retries: 5

  routes:
  # -------- Route 1: /mock (Employee) --------
  - name: mock-route
    paths:
      - /mock
    methods: [GET, POST, PUT, PATCH]
    protocols: [https]
    strip_path: true
    preserve_host: false

    plugins:
    - name: mocking
      enabled: true
      protocols: [http, https]
      config:
        api_specification: |+
          openapi: 3.0.3
          info:
            title: Employee Mock API
            version: "1.0.0"
          paths:
            /mock:
              get:
                responses:
                  "200":
                    description: Random employee
                    content:
                      application/json:
                        schema:
                          type: object
                          properties:
                            firstName:
                              type: string
                            middleName:
                              type: string
                            birthDate:
                              type: string
                              format: date
                            empId:
                              type: string

  # -------- Route 2: /customer --------
  - name: customer-route
    paths:
      - /customer
    methods: [GET]
    protocols: [https]
    strip_path: true
    preserve_host: false

    plugins:
    - name: mocking
      enabled: true
      protocols: [http, https]
      config:
        api_specification: |+
          openapi: 3.0.3
          info:
            title: Customer Mock API
            version: "1.0.0"
          paths:
            /customer:
              get:
                responses:
                  "200":
                    description: Random customer
                    content:
                      application/json:
                        schema:
                          type: object
                          properties:
                            customerName:
                              type: string
                            customerId:
                              type: string
                            customerAcc:
                              type: string
