_format_version: "3.0"
_konnect:
  control_plane_name: kong-local-dev
services:
- connect_timeout: 60000
  enabled: true
  host: example.com
  name: mock-service
  port: 443
  protocol: https
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    methods:
    - GET
    name: accounts-route
    path_handling: v0
    paths:
    - /accounts
    plugins:
    - config:
        api_specification: |+
          openapi: 3.0.3
          info:
            title: Accounts API
            version: "1.0.0"
          paths:
            /accounts:
              get:
                responses:
                  "200":
                    description: Account list
                    content:
                      application/json:
                        schema:
                          type: array
                          items:
                            type: object
                            properties:
                              accountId: { type: string }
                              type: { type: string }
                              balance: { type: number }

        api_specification_filename: null
        custom_base_path: null
        include_base_path: false
        included_status_codes: null
        max_delay_time: 1
        min_delay_time: 0.001
        random_delay: false
        random_examples: false
        random_status_code: false
      enabled: true
      name: mocking
      protocols:
      - http
      - https
    preserve_host: false
    protocols:
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: true
